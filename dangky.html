<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - Container Logistics</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Đăng ký</h2>
            <form id="registerForm">
                <div class="form-row">
                    <label>Họ và tên</label>
                    <input type="text" id="fullname" placeholder="Nhập họ và tên" required>
                </div>
                <div class="form-row">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Nhập email" required>
                </div>
                <div class="form-row">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" minlength="6" required>
                </div>
                <div class="form-row">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                </div>
                <div class="form-row">
                    <label>Vai trò</label>
                    <select id="role" required>
                        <option value="">-- Chọn vai trò --</option>
                        <option value="admin">Admin</option>
                        <option value="staff">Nhân viên</option>
                    </select>
                </div>
                <button type="submit" class="btn">Đăng ký</button>
            </form>
            <div id="registerMessage" class="small"></div>
            <div class="small" style="text-align:center;margin-top:12px">
                Đã có tài khoản? <a href="index.html">Đăng nhập</a>
            </div>
        </div>
    </div>
    <script src="dangky.js"></script>
</body>
</html>
