<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - Container Logistics</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Quên mật khẩu</h2>
            <form id="forgotForm">
                <div class="form-row">
                    <label>Email đã đăng ký</label>
                    <input type="email" id="email" placeholder="Nhập email" required>
                </div>
                <button type="submit" class="btn">Gửi hướng dẫn</button>
            </form>
            <div id="forgotMessage" class="small"></div>
            <div class="small" style="text-align:center;margin-top:12px">
                Nhớ mật khẩu rồi? <a href="index.html">Đăng nhập</a>
            </div>
        </div>
    </div>
    <script src="quenmatkhau.js"></script>
</body>
</html>
